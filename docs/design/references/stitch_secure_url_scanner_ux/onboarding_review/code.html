<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScanWise Onboarding - Review before opening</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .caution-pulse {
            animation: pulse-subtle 3s ease-in-out infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#89d5ba",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#b3dfff",
                        "secondary": "#51625d",
                        "primary-fixed-dim": "#89d5ba",
                        "on-secondary-container": "#566661",
                        "on-secondary-fixed": "#0f1e1a",
                        "on-secondary-fixed-variant": "#3a4a45",
                        "surface-container": "#edeeec",
                        "text-secondary": "#646B67",
                        "primary-container": "#176b55",
                        "on-primary-container": "#9be9cd",
                        "tertiary": "#0a4c6c",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d5e6e0",
                        "positive": "#287A55",
                        "text-primary": "#161A18",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#3f4944",
                        "tertiary-fixed-dim": "#99cdf2",
                        "surface-container-high": "#e7e8e6",
                        "on-primary-fixed": "#002117",
                        "secondary-fixed-dim": "#b9cac4",
                        "on-surface": "#191c1b",
                        "surface-container-highest": "#e2e3e1",
                        "primary": "#00513f",
                        "on-tertiary-fixed-variant": "#094c6b",
                        "surface-variant": "#e2e3e1",
                        "error": "#ba1a1a",
                        "surface": "#f9faf8",
                        "on-error": "#ffffff",
                        "surface-tint": "#166b55",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f0f1ef",
                        "outline": "#6f7974",
                        "surface-dim": "#d9dad8",
                        "surface-bright": "#f9faf8",
                        "critical": "#B43A3A",
                        "on-primary-fixed-variant": "#00513f",
                        "tertiary-fixed": "#c8e6ff",
                        "secondary-container": "#d2e4dd",
                        "tertiary-container": "#2d6485",
                        "on-tertiary": "#ffffff",
                        "caution": "#A66610",
                        "on-tertiary-fixed": "#001e2e",
                        "surface-container-low": "#f3f4f2",
                        "on-background": "#191c1b",
                        "on-primary": "#ffffff",
                        "outline-variant": "#bec9c3",
                        "divider": "#E2E6E2",
                        "primary-fixed": "#a4f2d6",
                        "surface-secondary": "#F1F3F0",
                        "background": "#f9faf8",
                        "surface-primary": "#FFFFFF",
                        "inverse-surface": "#2e3130"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "margin-horizontal": "20px",
                        "base": "8px",
                        "stack-sm": "4px",
                        "stack-md": "12px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "card-title": ["Inter"],
                        "body-default": ["Inter"],
                        "section-title": ["Inter"],
                        "screen-title": ["Inter"],
                        "label-compact": ["Inter"],
                        "screen-title-mobile": ["Inter"],
                        "body-supporting": ["Inter"]
                    },
                    "fontSize": {
                        "card-title": ["16px", {"lineHeight": "22px", "fontWeight": "600"}],
                        "body-default": ["15px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "section-title": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "screen-title": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-compact": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "screen-title-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-supporting": ["13px", {"lineHeight": "18px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-between font-body-default text-body-default overflow-hidden">
<!-- Header Section: Logo & Identity -->
<header class="w-full px-margin-horizontal pt-12 pb-6 flex flex-col items-center gap-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="security">security</span>
<span class="font-screen-title-mobile text-screen-title-mobile text-primary tracking-tight">ScanWise</span>
</div>
<h1 class="font-screen-title-mobile text-screen-title-mobile text-text-primary text-center mt-8">
            Review before opening
        </h1>
</header>
<!-- Content Area: Central Abstract Visual -->
<main class="flex-grow flex items-center justify-center w-full px-margin-horizontal">
<div class="relative w-full max-w-[320px] aspect-square flex items-center justify-center">
<!-- Background "Glass" Card -->
<div class="absolute inset-0 bg-surface-primary border border-divider rounded-[28px] shadow-sm transform -rotate-1"></div>
<!-- Abstract URL Visual -->
<div class="relative z-10 w-full flex flex-col gap-stack-md px-6">
<!-- URL Mockup -->
<div class="bg-surface-secondary rounded-xl p-4 border border-outline-variant flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="link">link</span>
<div class="flex flex-col">
<span class="text-label-compact font-label-compact text-secondary uppercase tracking-widest">Real Destination</span>
<span class="text-card-title font-card-title text-text-primary truncate">secure-banking.portal-auth.com</span>
</div>
</div>
<!-- Caution Badge (Floating) -->
<div class="caution-pulse self-end -mt-4 -mr-2 bg-caution/10 border border-caution rounded-full px-4 py-2 flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-caution text-xl" data-icon="warning" data-weight="fill">warning</span>
<span class="text-caution font-label-compact text-label-compact">Structural Anomaly</span>
</div>
<!-- Supporting Decor Elements -->
<div class="mt-4 flex flex-col gap-2 opacity-40">
<div class="h-1.5 w-3/4 bg-outline-variant rounded-full"></div>
<div class="h-1.5 w-1/2 bg-outline-variant rounded-full"></div>
</div>
</div>
<!-- Atmosphere Decor -->
<div class="absolute -bottom-4 -left-4 w-24 h-24 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -top-4 -right-4 w-24 h-24 bg-caution/5 rounded-full blur-3xl"></div>
</div>
</main>
<!-- Footer Section: Message, Pager, Action -->
<footer class="w-full px-margin-horizontal pb-12 flex flex-col gap-8">
<div class="flex flex-col gap-4 text-center px-4">
<p class="text-body-default text-text-secondary leading-relaxed">
                See the real destination and relevant structural warnings before leaving the app.
            </p>
<!-- Page Indicator -->
<div class="flex justify-center gap-2 py-4">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-card-title text-card-title h-14 rounded-[16px] shadow-sm active:scale-[0.98] transition-transform duration-150 flex items-center justify-center gap-2" onclick="console.log('Next clicked')">
            Continue
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<!-- Micro-interaction for the central card -->
<script>
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('main > div');
            if (!card) return;
            
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset rotation when mouse leaves or for touch
        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('main > div');
            if (card) card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body></html>
