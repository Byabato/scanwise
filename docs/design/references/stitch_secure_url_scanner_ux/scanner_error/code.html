<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        /* Scanning frame animation */
        @keyframes pulse-frame {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
        }
        .scanner-corner {
            width: 32px;
            height: 32px;
            border-color: white;
            position: absolute;
        }
        .scanner-frame {
            animation: pulse-frame 2s ease-in-out infinite;
        }

        /* Bottom sheet slide animation */
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* Blur Backdrop */
        .glass-header {
            background: rgba(25, 28, 27, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden">
<!-- Main Camera Background (Mock) -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" data-alt="A dark, moody interior shot of a low-light room with a blurred QR code on a wooden table. The lighting is dramatic and cinematic, emphasizing shadows and high-contrast textures. Subtle dust particles dance in a single beam of light, creating an atmosphere of quiet mystery. The color palette is dominated by deep forest greens and soft charcoal grays, aligning with a sophisticated corporate aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC4e7DwGaakyfVY3w2nygb8R5dwuJ19ZGmmJua0TjhRqgPPW6Ve3mXM5hvmsZtvqtsj-4po5NEVR4gJe_lxp3zq7QPXKBaj_OZluee9gBCpgEKAhjcvcHsz5eNBNeOjL-07HF2xO2fkWdOHhuswiTQVYgWNH5S_vYLmeuq9rDfR-wGqRA6ogTG2YEZkwES3-B05XtPk1DCvok0qZiLug_v8zoxd89l4UaMy9AU_VDJid1LFkBxUVC7drw')"></div>
<div class="absolute inset-0 bg-black/40"></div>
</div>
<!-- Scanning Interface Overlays -->
<div class="relative z-10 flex flex-col h-screen">
<!-- Top App Bar (Shared Component Logic) -->
<header class="glass-header text-white flex justify-between items-center w-full px-margin-horizontal h-16 fixed top-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed">security</span>
<h1 class="font-screen-title-mobile text-screen-title-mobile">ScanWise</h1>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined">flash_on</span>
</button>
</header>
<!-- Scanning Reticle Area -->
<main class="flex-grow flex items-center justify-center px-margin-horizontal">
<div class="relative w-64 h-64 scanner-frame">
<!-- Corners -->
<div class="scanner-corner top-0 left-0 border-t-4 border-l-4 rounded-tl-[20px]"></div>
<div class="scanner-corner top-0 right-0 border-t-4 border-r-4 rounded-tr-[20px]"></div>
<div class="scanner-corner bottom-0 left-0 border-b-4 border-l-4 rounded-bl-[20px]"></div>
<div class="scanner-corner bottom-0 right-0 border-b-4 border-r-4 rounded-br-[20px]"></div>
<!-- Laser Line Animation -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-primary-fixed-dim blur-[1px] opacity-50 animate-[scan_3s_linear_infinite]" style="animation: scan 3s linear infinite;"></div>
<style>
                    @keyframes scan {
                        0% { top: 0%; opacity: 0; }
                        50% { opacity: 1; }
                        100% { top: 100%; opacity: 0; }
                    }
                </style>
</div>
</main>
<!-- Bottom Sheet (The Result Sheet Task) -->
<div class="fixed inset-0 z-40 bg-black/40 backdrop-blur-[2px] transition-opacity">
<div class="absolute bottom-0 w-full animate-slide-up">
<div class="bg-surface-primary rounded-t-[28px] px-margin-horizontal pt-4 pb-10 shadow-2xl border-t border-divider">
<!-- Handle -->
<div class="flex justify-center mb-6">
<div class="w-8 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header & Icon Section -->
<div class="flex flex-col items-center text-center mb-stack-lg">
<div class="w-16 h-16 rounded-full bg-tertiary-fixed flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-tertiary text-[32px]">info</span>
</div>
<h2 class="font-screen-title-mobile text-screen-title-mobile text-text-primary mb-2">Unable to read code</h2>
<p class="font-body-default text-text-secondary max-w-[320px]">
                            The light might be too low or the code is damaged. Try adjusting your position or turning on the torch.
                        </p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-md mt-stack-lg">
<button class="w-full h-14 bg-primary text-white font-semibold rounded-[16px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">refresh</span>
<span>Try again</span>
</button>
<button class="w-full h-14 bg-[#DDEFE8] text-primary font-semibold rounded-[16px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">keyboard</span>
<span>Enter manually</span>
</button>
</div>
</div>
</div>
</div>
<!-- Hidden Bottom Nav (Suppressed per "Transactional/Focused" Rule) -->
<!-- The BottomNavBar from JSON is omitted here as we are in a focused "Error Result" state -->
</div>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate interaction with the "Try again" button
            const tryAgainBtn = document.querySelector('button.bg-primary');
            tryAgainBtn.addEventListener('click', () => {
                const sheet = tryAgainBtn.closest('.animate-slide-up');
                const overlay = sheet.parentElement.parentElement;
                
                // Animate Out
                sheet.style.transform = 'translateY(100%)';
                sheet.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 1, 1)';
                overlay.style.opacity = '0';
                overlay.style.transition = 'opacity 0.3s ease';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
            });
        });
    </script>
</body></html>
