<html class="light" lang="en"><head>

            -webkit-tap-highlight-color: transparent;

<body class="bg-background text-on-surface overflow-hidden">

</button>
</header>
<!-- Camera / Viewfinder Area (Background Canvas) -->

</div>
<!-- Scanning Frame -->
<div class="relative w-64 h-48 animate-scanner">
<div class="scanner-frame-corner top-0 left-0 border-t-3 border-l-3 rounded-tl-[20px]"></div>
<div class="scanner-frame-corner top-0 right-0 border-t-3 border-r-3 rounded-tr-[20px]"></div>
<div class="scanner-frame-corner bottom-0 left-0 border-b-3 border-l-3 rounded-bl-[20px]"></div>

<style>

</div>
</main>
<!-- Bottom Sheet Backdrop -->

<!-- Handle -->

<div class="w-8 h-1 bg-outline-variant rounded-full opacity-40"></div>
</div>
<div class="px-margin-horizontal pb-safe pt-2">
<!-- Header Section -->
<div class="flex flex-col items-start gap-stack-sm mb-stack-lg">
<span class="inline-flex items-center px-3 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-compact text-label-compact">
                    EAN-13
                </span>
<h1 class="font-screen-title-mobile text-screen-title-mobile text-text-primary mt-2">6001234567890</h1>
<!-- Status Badge -->

</div>

</button>
<button class="flex flex-col items-center justify-center p-3 gap-2 rounded-[20px] bg-surface-secondary border border-divider hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-secondary" data-icon="bookmark">bookmark</span>

<span class="material-symbols-outlined" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-label-compact text-label-compact">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
<span class="font-label-compact text-label-compact">Library</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container-highest rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-compact text-label-compact">Settings</span>
</a>
</nav>
<script>
        // Simple touch interaction for sheet "dragging" simulation
        let startY;
        const sheet = document.querySelector('.bottom-sheet-transition');
        const backdrop = document.querySelector('.bg-black\\/40');

        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        sheet.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0) {
                sheet.style.transform = `translateY(${diff}px)`;
                backdrop.style.opacity = Math.max(0, 0.4 - (diff / 1000));
            }
        });

        sheet.addEventListener('touchend', (e) => {
            const currentY = e.changedTouches[0].clientY;
            const diff = currentY - startY;
            if (diff > 100) {
                sheet.style.transform = `translateY(100%)`;
                backdrop.style.opacity = 0;
                setTimeout(() => {
                    // Logic to actually close/dismiss would go here
                }, 300);
            } else {
                sheet.style.transform = `translateY(0)`;
                backdrop.style.opacity = 0.4;
            }
        });

        // Toggle interaction for secondary actions
        document.querySelectorAll('.secondary-action-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 150);
            });
        });
    </script>
