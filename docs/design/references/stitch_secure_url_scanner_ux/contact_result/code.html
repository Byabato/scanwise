<script>
        const sheet = document.getElementById('bottom-sheet');
        const scrim = document.getElementById('scrim');
        const closeBtn = document.getElementById('close-sheet');

        function closeSheet() {
            sheet.style.transform = 'translateY(100%)';
            scrim.style.opacity = '0';
            setTimeout(() => {
                scrim.classList.add('hidden');
            }, 300);
        }

        function openSheet() {
            scrim.classList.remove('hidden');
            setTimeout(() => {
                scrim.style.opacity = '1';
                sheet.style.transform = 'translateY(0)';
            }, 50);
        }

        closeBtn.addEventListener('click', closeSheet);
        scrim.addEventListener('click', closeSheet);

        // Simulation for checkbox logic
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                const container = e.target.nextElementSibling;
                if(e.target.checked) {
                    container.classList.add('bg-secondary-container/30', 'border-primary/20');
                } else {
                    container.classList.remove('bg-secondary-container/30', 'border-primary/20');
                }
            });
        });

        // Initialize view
        window.addEventListener('DOMContentLoaded', () => {
            // Initial state is open for demo purposes
            openSheet();
        });
    </script>
