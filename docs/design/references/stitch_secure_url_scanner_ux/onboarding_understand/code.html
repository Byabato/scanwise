<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ScanWise Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-primary": "#89d5ba",
                    "on-error-container": "#93000a",
                    "on-tertiary-container": "#b3dfff",
                    "secondary": "#51625d",
                    "primary-fixed-dim": "#89d5ba",
                    "on-secondary-container": "#566661",
                    "on-secondary-fixed": "#0f1e1a",
                    "on-secondary-fixed-variant": "#3a4a45",
                    "surface-container": "#edeeec",
                    "text-secondary": "#646B67",
                    "primary-container": "#176b55",
                    "on-primary-container": "#9be9cd",
                    "tertiary": "#0a4c6c",
                    "surface-container-lowest": "#ffffff",
                    "secondary-fixed": "#d5e6e0",
                    "positive": "#287A55",
                    "text-primary": "#161A18",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#3f4944",
                    "tertiary-fixed-dim": "#99cdf2",
                    "surface-container-high": "#e7e8e6",
                    "on-primary-fixed": "#002117",
                    "secondary-fixed-dim": "#b9cac4",
                    "on-surface": "#191c1b",
                    "surface-container-highest": "#e2e3e1",
                    "primary": "#00513f",
                    "on-tertiary-fixed-variant": "#094c6b",
                    "surface-variant": "#e2e3e1",
                    "error": "#ba1a1a",
                    "surface": "#f9faf8",
                    "on-error": "#ffffff",
                    "surface-tint": "#166b55",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f0f1ef",
                    "outline": "#6f7974",
                    "surface-dim": "#d9dad8",
                    "surface-bright": "#f9faf8",
                    "critical": "#B43A3A",
                    "on-primary-fixed-variant": "#00513f",
                    "tertiary-fixed": "#c8e6ff",
                    "secondary-container": "#d2e4dd",
                    "tertiary-container": "#2d6485",
                    "on-tertiary": "#ffffff",
                    "caution": "#A66610",
                    "on-tertiary-fixed": "#001e2e",
                    "surface-container-low": "#f3f4f2",
                    "on-background": "#191c1b",
                    "on-primary": "#ffffff",
                    "outline-variant": "#bec9c3",
                    "divider": "#E2E6E2",
                    "primary-fixed": "#a4f2d6",
                    "surface-secondary": "#F1F3F0",
                    "background": "#f9faf8",
                    "surface-primary": "#FFFFFF",
                    "inverse-surface": "#2e3130"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-lg": "24px",
                    "margin-horizontal": "20px",
                    "base": "8px",
                    "stack-sm": "4px",
                    "stack-md": "12px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "card-title": ["Inter"],
                    "body-default": ["Inter"],
                    "section-title": ["Inter"],
                    "screen-title": ["Inter"],
                    "label-compact": ["Inter"],
                    "screen-title-mobile": ["Inter"],
                    "body-supporting": ["Inter"]
            },
            "fontSize": {
                    "card-title": ["16px", {"lineHeight": "22px", "fontWeight": "600"}],
                    "body-default": ["15px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "section-title": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "screen-title": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "label-compact": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "screen-title-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-supporting": ["13px", {"lineHeight": "18px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f9faf8; /* Warm off-white from background token */
            color: #161A18; /* text-primary */
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: contain;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Micro-interactions */
        .btn-active:active {
            transform: scale(0.97);
        }

        /* Abstract Visual Animations */
        @keyframes pulse-frame {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }
        .scan-corner {
            border-color: #00513f; /* forest green primary */
            width: 32px;
            height: 32px;
            border-width: 3px;
            position: absolute;
        }
        .animate-pulse-slow {
            animation: pulse-frame 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="font-body-default text-body-default min-h-screen flex flex-col overflow-hidden">
<!-- Top AppBar (Identity Anchor) -->
<header class="flex justify-between items-center w-full px-margin-horizontal h-16 bg-surface z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
<h1 class="font-screen-title-mobile text-screen-title-mobile text-primary tracking-tight">ScanWise</h1>
</div>
<!-- Optional Skip for onboarding -->
<button class="font-label-compact text-label-compact text-text-secondary hover:text-primary transition-colors">SKIP</button>
</header>
<main class="flex-1 flex flex-col px-margin-horizontal pt-stack-lg relative">
<!-- Onboarding Title -->
<div class="mb-stack-lg">
<h2 class="font-screen-title-mobile text-screen-title-mobile text-text-primary">Understand every scan</h2>
</div>
<!-- Central Abstract Visual Section -->
<div class="flex-1 flex items-center justify-center relative w-full overflow-hidden">
<!-- Background Atmospheric Glow -->
<div class="absolute w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<!-- Abstract Scanning Concept -->
<div class="relative w-72 h-72 flex items-center justify-center">
<!-- Scanning Frame -->
<div class="absolute inset-0 animate-pulse-slow">
<div class="scan-corner top-0 left-0 border-t-primary border-l-primary rounded-tl-[20px]"></div>
<div class="scan-corner top-0 right-0 border-t-primary border-r-primary rounded-tr-[20px]"></div>
<div class="scan-corner bottom-0 left-0 border-b-primary border-l-primary rounded-bl-[20px]"></div>
<div class="scan-corner bottom-0 right-0 border-b-primary border-r-primary rounded-br-[20px]"></div>
</div>
<!-- Info Card Visual (Restrained Sophistication) -->
<div class="z-10 w-56 bg-surface-primary border border-divider rounded-[20px] shadow-sm p-base transform rotate-[-2deg] transition-transform hover:rotate-0 duration-500">
<div class="flex items-center gap-3 mb-stack-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container text-[20px]">qr_code_2</span>
</div>
<div class="flex-1">
<div class="h-2 w-20 bg-surface-container-highest rounded-full mb-1"></div>
<div class="h-2 w-12 bg-surface-container-high rounded-full"></div>
</div>
</div>
<div class="space-y-2 mb-stack-md">
<div class="h-1.5 w-full bg-surface-container-low rounded-full"></div>
<div class="h-1.5 w-full bg-surface-container-low rounded-full"></div>
<div class="h-1.5 w-3/4 bg-surface-container-low rounded-full"></div>
</div>
<div class="py-stack-sm px-stack-md bg-positive/10 border border-positive/20 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-positive text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[11px] font-semibold text-positive uppercase tracking-wider">Safe Link</span>
</div>
</div>
<!-- Floating Semantic Decorative Elements -->
<div class="absolute -top-4 -right-2 w-12 h-12 bg-white border border-divider rounded-xl flex items-center justify-center shadow-sm transform rotate-12">
<span class="material-symbols-outlined text-caution" style="font-variation-settings: 'FILL' 1;">info</span>
</div>
</div>
</div>
<!-- Footer Area -->
<div class="pb-12 pt-stack-lg flex flex-col">
<!-- Message -->
<p class="font-body-default text-text-secondary mb-stack-lg leading-relaxed text-center sm:text-left">
                ScanWise translates QR codes and barcodes into clear information before you take action.
            </p>
<!-- Navigation & Actions Row -->
<div class="flex flex-col gap-gutter">
<!-- Indicators -->
<div class="flex justify-center sm:justify-start gap-2 mb-stack-md">
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Primary Action -->
<button class="btn-active w-full h-14 bg-primary text-on-primary rounded-[16px] font-semibold flex items-center justify-center gap-2 transition-all shadow-md active:shadow-none" onclick="window.location.reload()">
                    Next
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<!-- Bottom System Indicator Mock -->
<div class="h-8 flex justify-center items-end pb-2">
<div class="w-32 h-1 bg-surface-container-highest rounded-full"></div>
</div>
<script>
        // Simple entry animation trigger
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('h2, p, .relative.w-72, button');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = `all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) ${index * 0.1}s`;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100);
            });
        });

        // Micro-interaction for the card on touch
        const card = document.querySelector('.z-10.w-56');
        if(card) {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98) rotate(0deg)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1) rotate(-2deg)';
            });
        }
    </script>
</body></html>
