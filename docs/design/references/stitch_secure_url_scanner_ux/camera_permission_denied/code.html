<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>ScanWise - Permission Denied</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

                    "surface-container-lowest": "#ffffff",
                    "on-background": "#191c1b",
                    "surface-container-highest": "#e2e3e1",
                    "background": "#f9faf8",
                    "on-error-container": "#93000a",
                    "caution": "#A66610",
                    "tertiary-fixed-dim": "#99cdf2",
                    "on-error": "#ffffff",
                    "surface-secondary": "#F1F3F0",
                    "on-surface-variant": "#3f4944",
                    "text-secondary": "#646B67",
                    "surface-container": "#edeeec",
                    "on-secondary-fixed-variant": "#3a4a45",
                    "surface-container-low": "#f3f4f2",
                    "primary-fixed-dim": "#89d5ba",
                    "secondary": "#51625d",
                    "primary-fixed": "#a4f2d6",
                    "tertiary-container": "#2d6485",
                    "on-primary-container": "#9be9cd",
                    "secondary-fixed-dim": "#b9cac4",
                    "error-container": "#ffdad6",
                    "surface": "#f9faf8",
                    "surface-variant": "#e2e3e1",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d9dad8",
                    "surface-bright": "#f9faf8",
                    "inverse-surface": "#2e3130",
                    "on-tertiary-fixed": "#001e2e",
                    "text-primary": "#161A18",
                    "surface-primary": "#FFFFFF",
                    "on-surface": "#191c1b",
                    "primary": "#00513f",
                    "outline-variant": "#bec9c3",
                    "secondary-fixed": "#d5e6e0",
                    "on-tertiary-container": "#b3dfff",
                    "on-secondary-fixed": "#0f1e1a",
                    "surface-tint": "#166b55",
                    "on-secondary": "#ffffff",
                    "tertiary": "#0a4c6c",
                    "inverse-on-surface": "#f0f1ef",
                    "primary-container": "#176b55",
                    "error": "#ba1a1a",
                    "on-primary-fixed": "#002117",
                    "divider": "#E2E6E2",
                    "secondary-container": "#d2e4dd",
                    "critical": "#B43A3A",
                    "surface-container-high": "#e7e8e6",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "12px",
                    "margin-horizontal": "20px",

                    "gutter": "16px",

            "fontFamily": {

            "fontSize": {

<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ios-safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .transition-active {
            transition: transform 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .transition-active:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden select-none">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-margin-horizontal h-16 z-50 fixed top-0 left-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="security">security</span>
<h1 class="font-screen-title-mobile text-screen-title-mobile text-primary dark:text-primary-fixed-dim tracking-tight">ScanWise</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200">
<span class="material-symbols-outlined text-secondary dark:text-secondary-fixed-dim" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Canvas: Focused Journey (No Global Nav) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-horizontal pt-16 pb-8">
<!-- Illustration / Icon Cluster -->
<div class="relative w-full max-w-[280px] aspect-square flex items-center justify-center mb-stack-lg">
<!-- Background Halo -->
<div class="absolute inset-0 bg-surface-secondary rounded-full opacity-60 scale-90 blur-2xl"></div>
<!-- Central Icon Circle -->
<div class="relative w-32 h-32 bg-surface-container rounded-full border border-divider flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-secondary text-[48px]" data-icon="no_photography">no_photography</span>
</div>
<!-- Decorative Floating Nodes (Tonal Minimalism) -->
<div class="absolute top-4 left-4 w-12 h-12 rounded-2xl bg-secondary-container/30 border border-divider rotate-12 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="qr_code">qr_code</span>
</div>
<div class="absolute bottom-8 right-0 w-10 h-10 rounded-full bg-primary-container/10 border border-outline-variant -rotate-6 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-lg" data-icon="lock_open">lock_open</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center max-w-sm">
<h2 class="font-screen-title-mobile text-screen-title-mobile text-text-primary mb-stack-md">Camera access required</h2>
<p class="font-body-default text-body-default text-text-secondary leading-relaxed">
                ScanWise needs the camera to detect codes. Please enable it in system settings to continue.
            </p>
</div>
<!-- Action Area -->
<div class="w-full max-w-sm mt-stack-lg space-y-stack-md">
<button class="w-full h-14 bg-primary text-on-primary font-section-title text-section-title rounded-[16px] transition-active shadow-sm hover:brightness-110 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="settings">settings</span>
                Open app settings
            </button>
<button class="w-full h-14 bg-[#DDEFE8] text-primary font-section-title text-section-title rounded-[16px] transition-active flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="add_photo_alternate">add_photo_alternate</span>
                Import from gallery
            </button>
</div>
<!-- Security Badge -->
<div class="mt-auto pt-stack-lg flex items-center gap-2 py-4 px-6 rounded-full bg-surface-container-low border border-divider">
<span class="material-symbols-outlined text-positive text-sm" data-icon="verified_user" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-compact text-label-compact text-text-secondary uppercase tracking-widest">Privacy Protected</span>
</div>
</main>
<!-- Bottom Nav is suppressed per 'Destination Rule' for transactional/permission screens -->
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Simulate feedback haptics/animation
                btn.style.transition = 'transform 0.1s ease';
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    btn.style.transform = 'scale(1)';
                }, 100);
            });
        });

        // Simple parallax effect for decorative nodes
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            const nodes = document.querySelectorAll('.absolute');
            nodes.forEach((node, index) => {
                const depth = (index + 1) * 0.2;
                node.style.transform = `translate(${x * depth}px, ${y * depth}px) rotate(${index * 12}deg)`;
            });
        });
    </script>
</body></html>
