<style>
        body {
            background-color: #f9faf8;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .folder-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-text-primary">
<!-- Top Navigation / Logo Area -->
<header class="w-full px-margin-horizontal pt-12 pb-6 flex items-center justify-between z-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[20px]" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<span class="font-screen-title-mobile text-screen-title-mobile text-primary tracking-tight">ScanWise</span>
</div>
<button class="font-label-compact text-label-compact text-text-secondary px-4 py-2 hover:bg-surface-container-high transition-colors rounded-full">
            SKIP
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-horizontal relative">
<!-- Abstract Visual Section -->
<div class="w-full max-w-[320px] aspect-square relative flex items-center justify-center fade-in">
<!-- Background Decorative Elements -->
<div class="absolute inset-0 bg-secondary-container/20 rounded-full blur-3xl"></div>
<!-- Central Abstract Folder Cards -->
<div class="relative w-full h-full flex items-center justify-center">
<!-- Bottom Card (The Shadow/Base) -->
<div class="absolute w-[200px] h-[240px] bg-white border border-divider rounded-[20px] shadow-sm rotate-[-8deg] translate-x-[-20px] translate-y-[10px] opacity-60"></div>
<!-- Middle Card (Favorited) -->
<div class="folder-float absolute w-[210px] h-[250px] bg-white border border-divider rounded-[20px] shadow-md rotate-[4deg] translate-x-[15px] translate-y-[-15px] flex flex-col p-5 stagger-1">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="h-2 w-3/4 bg-surface-container-highest rounded-full mb-3"></div>
<div class="h-2 w-1/2 bg-surface-container rounded-full"></div>
</div>
<!-- Top Primary Card (Active Collection) -->
<div class="folder-float absolute w-[220px] h-[260px] bg-white border border-primary/10 rounded-[20px] shadow-xl flex flex-col p-6 stagger-2" style="animation-delay: 0.5s;">
<div class="flex justify-between items-start mb-6">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">folder</span>
</div>
<div class="flex gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
</div>
</div>
<div class="space-y-3">
<div class="h-2.5 w-full bg-surface-container-highest rounded-full"></div>
<div class="h-2.5 w-5/6 bg-surface-container-highest rounded-full"></div>
<div class="h-2.5 w-4/6 bg-surface-container rounded-full"></div>
</div>
<div class="mt-auto flex items-center gap-2">
<div class="w-6 h-6 rounded-md bg-secondary-container/50"></div>
<div class="h-2 w-16 bg-surface-container rounded-full"></div>
</div>
</div>
<!-- Floating Accent Chips -->
<div class="folder-float absolute top-10 right-4 w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center shadow-lg stagger-3" style="animation-delay: 1s;">
<span class="material-symbols-outlined text-primary text-[20px]">sticky_note_2</span>
</div>
</div>
</div>
<!-- Text Block -->
<div class="w-full text-center mt-stack-lg space-y-stack-md fade-in stagger-2">
<h1 class="font-screen-title text-screen-title text-text-primary px-4 leading-tight">
                Keep useful scans organized
            </h1>
<p class="font-body-default text-body-default text-text-secondary px-6">
                Save notes, collections and favorites locally on your device.
            </p>
</div>
</main>
<!-- Bottom Actions & Pagination -->
<footer class="w-full px-margin-horizontal pb-12 pt-6 flex flex-col items-center gap-8 fade-in stagger-3">
<!-- Pagination Dots -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-stack-md">
<button class="w-full h-14 bg-primary text-white font-section-title text-section-title rounded-[16px] hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center" onclick="handleStart()">
                Start scanning
            </button>
<button class="w-full h-12 bg-transparent text-text-secondary font-label-compact text-label-compact hover:text-primary transition-colors flex items-center justify-center">
                Review privacy
            </button>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        function handleStart() {
            // Haptic-like feedback visual
            const btn = event.currentTarget;
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
                // Logic for moving to next screen would go here
                console.log("Navigating to Scan interface...");
            }, 100);
        }

        // Simple observer to trigger animations if they weren't caught
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('fade-in');
                    }
                });
            });

            document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        });
    </script>
</body></html>
