<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ScanWise - Camera Permission</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<!-- Shared Style & Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#bec9c3",
                        "on-tertiary-container": "#b3dfff",
                        "caution": "#A66610",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#b9cac4",
                        "on-primary-container": "#9be9cd",
                        "surface-primary": "#FFFFFF",
                        "inverse-surface": "#2e3130",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "surface-secondary": "#F1F3F0",
                        "background": "#f9faf8",
                        "on-tertiary-fixed": "#001e2e",
                        "tertiary": "#0a4c6c",
                        "on-primary-fixed-variant": "#00513f",
                        "positive": "#287A55",
                        "on-secondary-fixed": "#0f1e1a",
                        "divider": "#E2E6E2",
                        "on-secondary": "#ffffff",
                        "text-primary": "#161A18",
                        "tertiary-fixed": "#c8e6ff",
                        "on-secondary-fixed-variant": "#3a4a45",
                        "surface-bright": "#f9faf8",
                        "surface": "#f9faf8",
                        "secondary": "#51625d",
                        "surface-variant": "#e2e3e1",
                        "on-primary-fixed": "#002117",
                        "outline": "#6f7974",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#99cdf2",
                        "on-surface-variant": "#3f4944",
                        "inverse-on-surface": "#f0f1ef",
                        "on-surface": "#191c1b",
                        "primary": "#00513f",
                        "surface-dim": "#d9dad8",
                        "surface-tint": "#166b55",
                        "primary-container": "#176b55",
                        "secondary-fixed": "#d5e6e0",
                        "text-secondary": "#646B67",
                        "surface-container-highest": "#e2e3e1",
                        "on-tertiary-fixed-variant": "#094c6b",
                        "on-secondary-container": "#566661",
                        "surface-container-low": "#f3f4f2",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#edeeec",
                        "on-background": "#191c1b",
                        "tertiary-container": "#2d6485",
                        "critical": "#B43A3A",
                        "secondary-container": "#d2e4dd",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#89d5ba",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#89d5ba",
                        "surface-container-high": "#e7e8e6",
                        "primary-fixed": "#a4f2d6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-md": "12px",
                        "stack-sm": "4px",
                        "margin-horizontal": "20px",
                        "base": "8px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "card-title": ["Inter"],
                        "body-default": ["Inter"],
                        "screen-title": ["Inter"],
                        "screen-title-mobile": ["Inter"],
                        "section-title": ["Inter"],
                        "label-compact": ["Inter"],
                        "body-supporting": ["Inter"]
                    },
                    "fontSize": {
                        "card-title": ["16px", {"lineHeight": "22px", "fontWeight": "600"}],
                        "body-default": ["15px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "screen-title": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "screen-title-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "section-title": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-compact": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "body-supporting": ["13px", {"lineHeight": "18px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .aperture-animate {
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .pulse-soft {
            animation: pulse-soft 3s ease-in-out infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- Top AppBar - Following JSON identity -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-margin-horizontal h-16 fixed top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="security">security</span>
<h1 class="font-screen-title-mobile text-screen-title-mobile text-primary dark:text-primary-fixed-dim">ScanWise</h1>
</div>
<div class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200">
<span class="material-symbols-outlined text-secondary" data-icon="help_outline">help_outline</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md px-margin-horizontal flex flex-col items-center justify-center pt-20 pb-12">
<!-- Hero Visual Section -->
<div class="relative w-full aspect-square flex items-center justify-center mb-10">
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 pulse-soft bg-primary rounded-full filter blur-3xl opacity-5"></div>
<!-- Abstract Aperture / Camera Frame Component -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Outer Ring -->
<div class="absolute inset-0 border-2 border-divider rounded-[40px] opacity-40"></div>
<!-- Animated Aperture Blades -->
<div class="aperture-animate relative w-48 h-48 border-[1px] border-outline-variant/30 rounded-full flex items-center justify-center">
<div class="absolute w-full h-[1px] bg-outline-variant/20 rotate-0"></div>
<div class="absolute w-full h-[1px] bg-outline-variant/20 rotate-45"></div>
<div class="absolute w-full h-[1px] bg-outline-variant/20 rotate-90"></div>
<div class="absolute w-full h-[1px] bg-outline-variant/20 rotate-135"></div>
<!-- Inner Focal Point -->
<div class="w-32 h-32 bg-surface-container-lowest border border-divider rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[64px]" data-icon="photo_camera" style="font-variation-settings: 'FILL' 0, 'wght' 200;">photo_camera</span>
</div>
</div>
<!-- Corner Scan Brackets (Material 3 Style) -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary rounded-tl-[20px]"></div>
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary rounded-tr-[20px]"></div>
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary rounded-bl-[20px]"></div>
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary rounded-br-[20px]"></div>
</div>
</div>
<!-- Typography & Content -->
<div class="text-center space-y-4 max-w-sm">
<h2 class="font-screen-title text-screen-title text-text-primary">Allow camera access.</h2>
<p class="font-body-default text-body-default text-text-secondary">
                ScanWise needs the camera to detect QR codes and barcodes. Images are processed on this device.
            </p>
</div>
<!-- Privacy Badge -->
<div class="mt-8 flex items-center gap-2 px-4 py-2 bg-surface-secondary rounded-full border border-divider">
<span class="material-symbols-outlined text-positive text-[18px]" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-compact text-label-compact text-text-primary uppercase tracking-wider">Processed on device</span>
</div>
</main>
<!-- Action Section -->
<footer class="w-full max-w-md px-margin-horizontal pb-10 space-y-3">
<button class="w-full h-14 bg-primary text-on-primary rounded-[16px] font-card-title text-card-title flex items-center justify-center gap-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
            Allow camera
        </button>
<button class="w-full h-14 bg-secondary-container text-on-secondary-container rounded-[16px] font-card-title text-card-title flex items-center justify-center gap-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="image">image</span>
            Import from gallery
        </button>
<p class="text-center font-body-supporting text-body-supporting text-text-secondary pt-2">
            You can change this anytime in settings.
        </p>
</footer>
<!-- Interactive script for subtle hover/touch effects -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.opacity = '0.9';
            });
            btn.addEventListener('touchend', () => {
                btn.style.opacity = '1';
            });
        });
    </script>
</body></html>
