<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                    "surface-container-highest": "#e2e3e1",
                    "on-secondary-fixed": "#0f1e1a",
                    "tertiary-fixed-dim": "#99cdf2",
                    "on-primary-fixed": "#002117",
                    "surface-secondary": "#F1F3F0",

<style>
        body {
            background-color: #F7F8F6; /* Background token from Design System */
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtle Fade In for Splash Content */
        @keyframes splashFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-splash {
            animation: splashFade 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Pulse for the "Processed on device" dot */
        @keyframes subtlePulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .dot-pulse {
            animation: subtlePulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<!-- Splash Screen Container (390x844 simulated mobile viewport) -->
<main class="relative w-[390px] h-[844px] bg-background flex flex-col items-center justify-between py-16 overflow-hidden">
<!-- Top Spacer for vertical balance -->
<div class="h-12 w-full"></div>
<!-- Center Brand Cluster -->
<section class="flex flex-col items-center animate-splash">
<!-- Brand Logo (Shield with Scan Icon) -->
<div class="w-24 h-24 bg-primary-fixed rounded-[28px] flex items-center justify-center mb-6 relative">
<!-- Outer Glow (Minimal elevation as per Design System Level 2) -->
<div class="absolute inset-0 rounded-[28px] shadow-[0px_4px_8px_rgba(0,0,0,0.1)] opacity-20"></div>
<div class="flex items-center justify-center text-primary relative">
<!-- Material Icon: Security (Shield Context) -->
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'wght' 300;">
                        security
                    </span>
<!-- Nested Icon: QR/Scan overlay concept -->
<div class="absolute bg-primary-fixed rounded-full p-1 -bottom-1 -right-1 border-4 border-background">
<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">
                            qr_code_scanner
                        </span>
</div>
</div>
</div>
<!-- Wordmark -->
<h1 class="font-screen-title-mobile text-screen-title-mobile text-text-primary tracking-tight">
                ScanWise
            </h1>
<!-- Tagline -->
<p class="font-body-supporting text-body-supporting text-text-secondary mt-1">
                Calm Intelligence. Pure Privacy.
            </p>
</section>
<!-- Bottom Footer Actions & Privacy Label -->
<footer class="w-full flex flex-col items-center px-margin-horizontal space-y-12 animate-splash" style="animation-delay: 200ms;">
<!-- Privacy Label -->
<div class="flex items-center space-x-2 bg-surface-secondary px-4 py-2 rounded-full border border-divider">
<span class="w-2 h-2 rounded-full bg-positive dot-pulse"></span>
<span class="font-label-compact text-label-compact text-on-secondary-container">
                    Privacy Protected
                </span>
</div>
<!-- Meta Information -->
<div class="flex flex-col items-center space-y-1">
<p class="font-label-compact text-label-compact text-outline-variant">
                    v2.4.0 • Built for Security
                </p>
<p class="font-label-compact text-[10px] text-outline-variant uppercase tracking-[0.2em]">
                    Processed on Device
                </p>
</div>
</footer>
<!-- Background Atmospheric Detail (Subtle Grid or Pattern if needed, but keeping it restrained) -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(#00513f 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
</main>
<!-- Simple micro-interaction for entry -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulated loading progress or transition could go here
            console.log('ScanWise Splash Loaded');
            
            // Interaction: Tap screen to "enter" (Simulated)
            document.body.addEventListener('click', () => {
                const main = document.querySelector('main');
                main.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                main.style.opacity = '0';
                main.style.transform = 'scale(1.02)';
                
                setTimeout(() => {
                    // In a real app, this would route to the main dashboard
                    location.reload(); 
                }, 600);
            });
        });
    </script>
</body></html>
